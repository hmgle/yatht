[package]
name = "yatht"
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Transparent TCP and UDP proxying with seccomp user notification and ADDFD"
repository = "https://github.com/hmgle/yatht"
homepage = "https://github.com/hmgle/yatht"
readme = "README.md"
keywords = ["linux", "seccomp", "proxy", "socks5", "network"]
categories = ["command-line-utilities", "network-programming", "os::linux"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
humantime = "2.1"
ipnet = { version = "2.11", features = ["serde"] }
libc = "0.2"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"

[dev-dependencies]
tempfile = "3.15"
