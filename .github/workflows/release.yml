name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and upload release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          dir="yatht-${GITHUB_REF_NAME}-x86_64-linux-gnu"
          mkdir "${dir}"
          cp target/release/yatht README.md LICENSE "${dir}/"
          tar -czf "${dir}.tar.gz" "${dir}"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attach artifacts to an existing release for this tag (created
          # manually with curated notes), or create one with generated notes.
          gh release upload "${GITHUB_REF_NAME}" yatht-*.tar.gz yatht-*.tar.gz.sha256 --clobber ||
            gh release create "${GITHUB_REF_NAME}" yatht-*.tar.gz yatht-*.tar.gz.sha256 --generate-notes
